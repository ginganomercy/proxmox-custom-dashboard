<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 512 512" width="100%" height="100%">
  <defs>
    <!-- Background: deep navy to indigo gradient -->
    <linearGradient id="bgGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#0b162c"/>
      <stop offset="55%" stop-color="#1e3a8a"/>
      <stop offset="100%" stop-color="#2563eb"/>
    </linearGradient>
    <!-- Cloud: bright white-blue shimmer -->
    <linearGradient id="cloudGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#ffffff"/>
      <stop offset="100%" stop-color="#dbeafe"/>
    </linearGradient>
    <!-- Server bar: dark navy -->
    <linearGradient id="serverGrad" x1="0%" y1="0%" x2="100%" y2="0%">
      <stop offset="0%" stop-color="#0f172a"/>
      <stop offset="100%" stop-color="#1e293b"/>
    </linearGradient>
    <!-- Blue glow drop shadow -->
    <filter id="glow" x="-20%" y="-20%" width="140%" height="140%">
      <feDropShadow dx="0" dy="12" stdDeviation="18" flood-color="#2563eb" flood-opacity="0.55"/>
    </filter>
    <!-- Soft inner glow for server bars -->
    <filter id="softglow">
      <feGaussianBlur stdDeviation="3" result="blur"/>
      <feMerge>
        <feMergeNode in="blur"/>
        <feMergeNode in="SourceGraphic"/>
      </feMerge>
    </filter>
  </defs>

  <!-- Background rounded square -->
  <rect width="512" height="512" rx="108" fill="url(#bgGrad)" filter="url(#glow)"/>

  <!-- Subtle dot-grid texture for tech feel -->
  <g opacity="0.06">
    <circle cx="128" cy="128" r="3" fill="#ffffff"/>
    <circle cx="256" cy="128" r="3" fill="#ffffff"/>
    <circle cx="384" cy="128" r="3" fill="#ffffff"/>
    <circle cx="128" cy="384" r="3" fill="#ffffff"/>
    <circle cx="256" cy="384" r="3" fill="#ffffff"/>
    <circle cx="384" cy="384" r="3" fill="#ffffff"/>
    <circle cx="128" cy="256" r="3" fill="#ffffff"/>
    <circle cx="384" cy="256" r="3" fill="#ffffff"/>
  </g>

  <!-- CLOUD SHAPE — smooth bezier, white-blue gradient -->
  <path
    d="
      M 256 100
      C 196 100, 152 136, 144 188
      C 108 194, 80 224, 80 262
      C 80 304, 114 332, 156 332
      L 356 332
      C 406 332, 440 298, 440 258
      C 440 220, 412 192, 376 188
      C 368 136, 316 100, 256 100 Z
    "
    fill="url(#cloudGrad)"
    opacity="0.96"
  />

  <!-- SERVER BAR 1 (upper) -->
  <rect x="148" y="220" width="216" height="38" rx="10" fill="url(#serverGrad)" filter="url(#softglow)"/>
  <!-- LED indicators row 1 -->
  <circle cx="175" cy="239" r="8" fill="#3b82f6"/>
  <circle cx="203" cy="239" r="8" fill="#10b981"/>
  <!-- Disk/slot lines row 1 -->
  <rect x="228" y="230" width="48" height="5" rx="2.5" fill="#334155" opacity="0.8"/>
  <rect x="228" y="243" width="32" height="5" rx="2.5" fill="#334155" opacity="0.5"/>
  <!-- Activity LED row 1 -->
  <circle cx="343" cy="239" r="5" fill="#f59e0b" opacity="0.9"/>

  <!-- SERVER BAR 2 (lower) -->
  <rect x="148" y="272" width="216" height="38" rx="10" fill="url(#serverGrad)" filter="url(#softglow)"/>
  <!-- LED indicators row 2 -->
  <circle cx="175" cy="291" r="8" fill="#3b82f6"/>
  <circle cx="203" cy="291" r="8" fill="#10b981"/>
  <!-- Disk/slot lines row 2 -->
  <rect x="228" y="282" width="48" height="5" rx="2.5" fill="#334155" opacity="0.8"/>
  <rect x="228" y="295" width="32" height="5" rx="2.5" fill="#334155" opacity="0.5"/>
  <!-- Activity LED row 2 -->
  <circle cx="343" cy="291" r="5" fill="#10b981" opacity="0.9"/>

  <!-- LIGHTNING BOLT ACCENT — amber, signals compute/power -->
  <polygon
    points="268,118 248,158 262,158 244,192 278,148 264,148 268,118"
    fill="#f59e0b"
    opacity="0.85"
  />

  <!-- Top highlight arc on cloud for 3D depth -->
  <path
    d="M 200 110 Q 256 88 310 110"
    stroke="#ffffff"
    stroke-width="4"
    fill="none"
    opacity="0.35"
    stroke-linecap="round"
  />
</svg>