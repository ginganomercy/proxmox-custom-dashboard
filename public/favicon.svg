<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 512 512" width="100%" height="100%">
  <defs>
    <linearGradient id="bg" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#0f0c29"/>
      <stop offset="50%" stop-color="#302b63"/>
      <stop offset="100%" stop-color="#24243e"/>
    </linearGradient>
    <linearGradient id="bolt" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#a78bfa"/>
      <stop offset="50%" stop-color="#8b5cf6"/>
      <stop offset="100%" stop-color="#6d28d9"/>
    </linearGradient>
    <linearGradient id="glow" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#f0abfc"/>
      <stop offset="100%" stop-color="#c084fc"/>
    </linearGradient>
    <filter id="shadow">
      <feDropShadow dx="0" dy="8" stdDeviation="16" flood-color="#7c3aed" flood-opacity="0.6"/>
    </filter>
    <filter id="glow-filter">
      <feGaussianBlur stdDeviation="8" result="blur"/>
      <feMerge>
        <feMergeNode in="blur"/>
        <feMergeNode in="SourceGraphic"/>
      </feMerge>
    </filter>
  </defs>

  <!-- Background rounded rectangle -->
  <rect width="512" height="512" rx="112" fill="url(#bg)"/>

  <!-- Subtle grid lines for tech feel -->
  <line x1="0" y1="170" x2="512" y2="170" stroke="#ffffff" stroke-width="0.5" opacity="0.05"/>
  <line x1="0" y1="342" x2="512" y2="342" stroke="#ffffff" stroke-width="0.5" opacity="0.05"/>
  <line x1="170" y1="0" x2="170" y2="512" stroke="#ffffff" stroke-width="0.5" opacity="0.05"/>
  <line x1="342" y1="0" x2="342" y2="512" stroke="#ffffff" stroke-width="0.5" opacity="0.05"/>

  <!-- Lightning bolt — main shape (outer glow layer) -->
  <polygon
    points="290,68 160,290 240,290 220,444 352,222 272,222 290,68"
    fill="url(#glow)"
    opacity="0.3"
    filter="url(#glow-filter)"
  />

  <!-- Lightning bolt — main shape -->
  <polygon
    points="290,68 160,290 240,290 220,444 352,222 272,222 290,68"
    fill="url(#bolt)"
    filter="url(#shadow)"
  />

  <!-- Highlight stripe on bolt -->
  <polygon
    points="280,90 190,248 240,248 225,340 290,210 250,210 280,90"
    fill="#c4b5fd"
    opacity="0.5"
  />
</svg>